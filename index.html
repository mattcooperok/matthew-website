
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Matthew Cooper</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 5%;
      background: #000000;
      color: #E8E5DC;
      font-family: 'Inter', sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto 100px;
    }

    .email {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .socials a {
      display: flex;
      align-items: center;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    .socials a:hover {
      opacity: 0.5;
    }

    .socials svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .socials .tiktok-icon {
      fill: currentColor;
      stroke: none;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: clamp(42px, 7vw, 82px);
      font-weight: 700;
      letter-spacing: -0.065em;
      margin: 0;
      line-height: 1;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 400;
      margin-top: 18px;
      letter-spacing: 0.01em;
      opacity: 0.75;
    }

    .videos {
      margin-top: 65px;
    }

    .video-row {
      display: grid;
      gap: 24px;
      margin-bottom: 24px;
      align-items: start;
    }

    .video-row.two {
      grid-template-columns: repeat(2, 1fr);
    }

    .video-row.three {
      grid-template-columns: 1.5fr 1fr 1fr;
    }

    /* Stack the second YouTube video and SoundCloud */
    .video-stack {
      display: grid;
      gap: 24px;
      align-content: start;
    }

    .video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
    }

    .video.tiktok,
    .video.vertical {
      aspect-ratio: 9 / 16;
      max-width: 340px;
    }

    .video.square {
      aspect-ratio: 1 / 1;
    }

    .video iframe,
    .video video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: cover;
    }

    @media (max-width: 650px) {
      body {
        padding: 24px 6%;
      }

      .top-bar {
        margin-bottom: 80px;
      }

      .video-row.two,
      .video-row.three {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="top-bar">
    <a class="email" href="mailto:mmattcooper1@gmail.com">
      mmattcooper1@gmail.com
    </a>

    <div class="socials">

      <a href="https://www.instagram.com/YOURUSERNAME/" target="_blank" aria-label="Instagram">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="18" cy="6" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
      </a>

      <a href="https://www.tiktok.com/@YOURUSERNAME" target="_blank" aria-label="TikTok">
        <svg class="tiktok-icon" viewBox="0 0 24 24">
          <path d="M19.6 8.2a7.1 7.1 0 0 1-4.2-1.4v8.1a6 6 0 1 1-6-6c.4 0 .8 0 1.2.1v3.3a2.8 2.8 0 1 0 1.9 2.7V2h3.3a4.2 4.2 0 0 0 3.8 3.8v2.4z"/>
        </svg>
      </a>

    </div>
  </header>

  <main class="container">

    <h1>MATTHEW COOPER</h1>
    <p class="subtitle">Creator · Filmmaker · Musician</p>

    <section class="videos">

      <!-- FIRST ROW: TWO VIDEOS -->
      <div class="video-row two">

        <!-- 3D animated text -->
        <div class="video">
          <video autoplay muted loop playsinline
            style="width: 100%; height: 100%; object-fit: cover;">
            <source src="text3d.mp4" type="video/mp4">
          </video>
        </div>

        <!-- YouTube video 1-->
        <div class="video">
          <iframe
            src="https://www.youtube.com/embed/JW4YkyVyXNk?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&start=127"
            title="Matthew Cooper video 1"
            allow="autoplay; encrypted-media; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>

      </div>

      <!-- SECOND ROW: STACKED VIDEO + TWO VERTICAL VIDEOS -->
      <div class="video-row three">

        <!-- LEFT COLUMN: YOUTUBE + SOUNDCLOUD -->
        <div class="video-stack">

          <!-- YouTube video 2 -->
          <div class="video">
            <iframe
              src="https://www.youtube.com/embed/d0HTe1XFEoM?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&start=5"
              title="Matthew Cooper video 2"
              allow="autoplay; encrypted-media; picture-in-picture"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen>
            </iframe>
          </div>

          <!-- SoundCloud-->
          <div class="video">
            <iframe
              id="soundcloudPlayer"
              src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1664305848&color=%23ff5500&auto_play=true&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true"
              title="I -love- birds"
              allow="autoplay; encrypted-media"
              scrolling="no">
            </iframe>
          </div>

        </div>

        <!-- Maybelline vertical video -->
        <div class="video vertical">
          <video autoplay muted loop playsinline id="myVideo"
            style="width: 100%; height: 100%; object-fit: cover;">
            <source src="Maybelline Harley Alaska_1920p.mp4" type="video/mp4">
          </video>
        </div>

        <!-- TikTok vertical video -->
        <div class="video tiktok">
          <iframe
            src="https://www.tiktok.com/player/v1/7000296469785775361?embed_from=oembed&music_info=1&description=1"
            width="100%"
            height="100%"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            title="TikTok video">
          </iframe>
        </div>

      </div>

    </section>

  </main>

  <!-- SoundCloud player API -->
  <script src="https://w.soundcloud.com/player/api.js"></script>

  <script>
    // Start SoundCloud at 2 minutes 17 seconds
    const soundcloudFrame = document.getElementById("soundcloudPlayer");
    const soundcloudWidget = SC.Widget(soundcloudFrame);

    soundcloudWidget.bind(SC.Widget.Events.READY, function() {
      soundcloudWidget.seekTo(809000);
      soundcloudWidget.play();
    });

    // Maybelline video starts at 2 seconds
    const video = document.getElementById("myVideo");

    video.addEventListener("loadedmetadata", function() {
      video.currentTime = 2;
      video.play();
    });
  </script>

</body>
</html>
