
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Matthew Cooper</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 5%;
      background: #000000;
      color: #E8E5DC;
      font-family: 'Inter', sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto 100px;
    }

    .email {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .socials a {
      display: flex;
      align-items: center;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    .socials a:hover {
      opacity: 0.5;
    }

    .socials svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .socials .tiktok-icon {
      fill: currentColor;
      stroke: none;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: clamp(42px, 7vw, 82px);
      font-weight: 700;
      letter-spacing: -0.065em;
      margin: 0;
      line-height: 1;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 400;
      margin-top: 18px;
      letter-spacing: 0.01em;
      opacity: 0.75;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-top: 65px;
    }

    .video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
    }

    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 650px) {
      body {
        padding: 24px 6%;
      }

      .top-bar {
        margin-bottom: 80px;
      }

      .videos {
        grid-template-columns: 1fr;
        gap: 20px;
        margin-top: 45px;
      }
    }
  </style>
</head>

<body>

  <header class="top-bar">
    <a class="email" href="mailto:mmattcooper1@gmail.com">
      mmattcooper1@gmail.com
    </a>

    <div class="socials">

      <!-- Replace YOURUSERNAME with your Instagram username -->
      <a href="https://www.instagram.com/YOURUSERNAME/" target="_blank" aria-label="Instagram">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="18" cy="6" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
      </a>

      <!-- Replace YOURUSERNAME with your TikTok username -->
      <a href="https://www.tiktok.com/@YOURUSERNAME" target="_blank" aria-label="TikTok">
        <svg class="tiktok-icon" viewBox="0 0 24 24">
          <path d="M19.6 8.2a7.1 7.1 0 0 1-4.2-1.4v8.1a6 6 0 1 1-6-6c.4 0 .8 0 1.2.1v3.3a2.8 2.8 0 1 0 1.9 2.7V2h3.3a4.2 4.2 0 0 0 3.8 3.8v2.4z"/>
        </svg>
      </a>

    </div>
  </header>

  <main class="container">

    <h1>MATTHEW COOPER</h1>
    <p class="subtitle">Creator · Filmmaker · Musician</p>

    <section class="videos">

      <div class="video">
        <iframe
          src="https://www.youtube.com/embed/JW4YkyVyXNk?autoplay=1&mute=1&controls=0&playsinline=1&rel=0"
          title="Matthew Cooper video 1"
          allow="autoplay; encrypted-media; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>

      <div class="video">
        <iframe
          src="https://www.youtube.com/embed/d0HTe1XFEoM?autoplay=1&mute=1&controls=0&playsinline=1&rel=0"
          title="Matthew Cooper video 2"
          allow="autoplay; encrypted-media; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>

    </section>

  </main>

</body>
</html>
